<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#3b2a8f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- the grid's edge and column guides -->
  <rect x="48" y="40" width="560" height="350" rx="30" fill="none" stroke="#c4b5fd" stroke-width="3.5" stroke-dasharray="10 10"/>

  <!-- sparkles -->
  <path d="M42 28 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7z" fill="#f2a33a"/>
  <path d="M618 96 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#22a06b"/>

  <!-- wide chart widget -->
  <rect x="72" y="62" width="320" height="150" rx="22" fill="#6366f1"/>
  <rect x="96" y="84" width="118" height="22" rx="11" fill="#ffffff"/>
  <circle cx="330" cy="95" r="7" fill="#ffffff" opacity="0.55"/>
  <circle cx="356" cy="95" r="7" fill="#ffffff" opacity="0.55"/>
  <rect x="100" y="160" width="26" height="30" rx="6" fill="#ffffff" opacity="0.9"/>
  <rect x="140" y="140" width="26" height="50" rx="6" fill="#ffffff" opacity="0.9"/>
  <rect x="180" y="150" width="26" height="40" rx="6" fill="#ffffff" opacity="0.9"/>
  <rect x="220" y="124" width="26" height="66" rx="6" fill="#ffffff" opacity="0.9"/>
  <rect x="260" y="134" width="26" height="56" rx="6" fill="#ffffff" opacity="0.9"/>
  <path d="M352 196 l22 -22 M362 198 l12 -12" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- tall list widget -->
  <rect x="412" y="62" width="172" height="150" rx="22" fill="#0f9488"/>
  <rect x="434" y="84" width="76" height="22" rx="11" fill="#ffffff"/>
  <rect x="434" y="128" width="128" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
  <rect x="434" y="154" width="98" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
  <rect x="434" y="180" width="114" height="14" rx="7" fill="#ffffff" opacity="0.85"/>

  <!-- stat widget -->
  <rect x="72" y="232" width="200" height="136" rx="22" fill="#ea580c"/>
  <rect x="94" y="254" width="80" height="22" rx="11" fill="#ffffff"/>
  <circle cx="132" cy="324" r="24" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="10"/>
  <path d="M132 300 a24 24 0 1 1 -22.8 31.4" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <rect x="180" y="306" width="70" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
  <rect x="180" y="330" width="48" height="14" rx="7" fill="#ffffff" opacity="0.85"/>

  <!-- where the dragged widget will land -->
  <rect x="292" y="232" width="292" height="136" rx="22" fill="#ede9fe" fill-opacity="0.7" stroke="#a78bfa" stroke-width="3.5" stroke-dasharray="12 9"/>

  <!-- the widget being dragged -->
  <g transform="rotate(-5 470 280)" filter="url(#lift)">
    <rect x="330" y="206" width="280" height="130" rx="22" fill="#8b5cf6"/>
    <rect x="354" y="228" width="104" height="22" rx="11" fill="#ffffff"/>
    <rect x="354" y="270" width="200" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
    <rect x="354" y="296" width="150" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
    <circle cx="578" cy="239" r="7" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- the pointer dragging it -->
  <path d="M500 236 l0 66 15 -15 13 28 14 -6 -13 -28 21 0z" fill="#ffffff" stroke="#1f2328" stroke-width="5" stroke-linejoin="round"/>

  <!-- drag hint dots, like QueryKrafter's -->
  <circle cx="620" cy="300" r="7" fill="#7c3aed"/>
  <circle cx="620" cy="322" r="5" fill="#a78bfa"/>
  <circle cx="620" cy="340" r="3.5" fill="#c4b5fd"/>
</svg>
